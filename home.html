<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tests</title>
<style>
  :root{
    --bg:#F4F7F5; --surface:#FFFFFF; --surface-2:#FAFBFA; --surface-3:#F1F4F2;
    --border:#E4E9E5; --border-strong:#D3DAD5;
    --text:#16211C; --muted:#5F6B65; --faint:#8A948E;
    --accent:#147A57; --accent-hover:#0F6146; --accent-soft:#E4F1EB; --on-accent:#FFFFFF;
    --amber-bg:#FBF0DA; --amber-tx:#946213;
    --slate-bg:#EDF0F2; --slate-tx:#586572;
    --rose-bg:#FBE8E6; --rose-tx:#B0463B;
    --shadow-sm:0 1px 2px rgba(20,40,30,.06), 0 1px 3px rgba(20,40,30,.04);
    --shadow-md:0 4px 12px -4px rgba(20,40,30,.12), 0 2px 6px -2px rgba(20,40,30,.08);
    --shadow-lg:0 24px 60px -20px rgba(20,40,30,.4);
    --radius:9px; --radius-sm:6px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0E1411; --surface:#161D19; --surface-2:#1A221D; --surface-3:#202A24;
      --border:#26302A; --border-strong:#334038;
      --text:#E9EEEB; --muted:#9BA8A1; --faint:#71807A;
      --accent:#3FB488; --accent-hover:#57C79A; --accent-soft:#173028; --on-accent:#08130E;
      --amber-bg:#33280F; --amber-tx:#E4B463; --slate-bg:#222B31; --slate-tx:#9FB0BC;
      --rose-bg:#331E1C; --rose-tx:#E39189;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 6px 18px -6px rgba(0,0,0,.5);
      --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="light"]{
    --bg:#F4F7F5; --surface:#FFFFFF; --surface-2:#FAFBFA; --surface-3:#F1F4F2;
    --border:#E4E9E5; --border-strong:#D3DAD5;
    --text:#16211C; --muted:#5F6B65; --faint:#8A948E;
    --accent:#147A57; --accent-hover:#0F6146; --accent-soft:#E4F1EB; --on-accent:#FFFFFF;
    --amber-bg:#FBF0DA; --amber-tx:#946213; --slate-bg:#EDF0F2; --slate-tx:#586572;
    --rose-bg:#FBE8E6; --rose-tx:#B0463B;
  }
  :root[data-theme="dark"]{
    --bg:#0E1411; --surface:#161D19; --surface-2:#1A221D; --surface-3:#202A24;
    --border:#26302A; --border-strong:#334038;
    --text:#E9EEEB; --muted:#9BA8A1; --faint:#71807A;
    --accent:#3FB488; --accent-hover:#57C79A; --accent-soft:#173028; --on-accent:#08130E;
    --amber-bg:#33280F; --amber-tx:#E4B463; --slate-bg:#222B31; --slate-tx:#9FB0BC;
    --rose-bg:#331E1C; --rose-tx:#E39189;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  .tnum{font-variant-numeric:tabular-nums;}
  [hidden]{display:none !important;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;}
  .login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;box-shadow:var(--shadow-md);padding:32px 30px;}
  .login-brand{display:flex;align-items:center;gap:11px;margin-bottom:22px;}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--accent-hover));
    display:grid;place-items:center;color:var(--on-accent);font-weight:800;font-size:17px;flex-shrink:0;}
  .login-brand .nm{font-weight:700;font-size:17px;letter-spacing:-.01em;}
  .login-card h1{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.02em;}
  .login-card .lede{margin:0 0 22px;color:var(--muted);font-size:13.5px;line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:11px 13px;font-size:14.5px;color:var(--text);}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600;
    border-radius:8px;padding:11px 16px;border:1px solid transparent;width:100%;}
  .btn.primary{background:var(--accent);color:var(--on-accent);}
  .btn.primary:hover{background:var(--accent-hover);}
  .btn.primary:disabled{opacity:.6;cursor:not-allowed;}
  .err{background:var(--rose-bg);color:var(--rose-tx);font-size:13px;font-weight:500;
    padding:10px 13px;border-radius:8px;margin-bottom:16px;}

  /* ---------- App shell ---------- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:58px;
    padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;}
  .brand .logo{width:28px;height:28px;border-radius:8px;font-size:15px;}
  .spacer{flex:1;}
  .who{display:flex;align-items:center;gap:9px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-size:12.5px;}
  .who .nm{font-size:13px;font-weight:600;line-height:1.15;}
  .who .sub{font-size:11px;color:var(--faint);}
  .link-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;
    padding:8px 13px;border-radius:8px;}
  .link-btn:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-3);}

  .main{max-width:1080px;margin:0 auto;padding:32px 24px 72px;}
  .hello{margin-bottom:22px;}
  .hello h1{margin:0 0 5px;font-size:24px;font-weight:700;letter-spacing:-.02em;text-wrap:balance;}
  .hello p{margin:0;color:var(--muted);font-size:14px;}

  .tabs{display:flex;gap:2px;margin-bottom:22px;border-bottom:1px solid var(--border);overflow-x:auto;}
  .tab{padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--muted);background:none;border:none;
    border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab .n{font-size:11px;color:var(--faint);margin-left:5px;font-variant-numeric:tabular-nums;}
  .tab.active .n{color:var(--accent);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-sm);padding:18px;display:flex;flex-direction:column;gap:12px;
    transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease;}
  .tcard.live{cursor:pointer;}
  .tcard.live:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border-strong);}
  .tcard.locked{opacity:.85;}
  .tcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .tcard h3{margin:0;font-size:16.5px;font-weight:650;letter-spacing:-.01em;line-height:1.25;}
  .tcard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);}
  .tcard .meta span{display:inline-flex;align-items:center;gap:5px;}
  .tcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px;
    padding-top:13px;border-top:1px solid var(--border);}
  .score{font-size:19px;font-weight:700;letter-spacing:-.01em;}
  .score small{font-size:12px;font-weight:500;color:var(--faint);}
  .cta{font-size:13px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:5px;}
  .cta.muted{color:var(--faint);}
  .go{background:var(--accent);color:var(--on-accent);border:none;font-weight:600;font-size:13px;
    padding:8px 15px;border-radius:8px;}
  .go:hover{background:var(--accent-hover);}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9;}
  .badge.available{background:var(--accent-soft);color:var(--accent);}
  .badge.scheduled{background:var(--amber-bg);color:var(--amber-tx);}
  .badge.completed{background:var(--slate-bg);color:var(--slate-tx);}
  .badge.closed{background:var(--rose-bg);color:var(--rose-tx);}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:60px 20px;}
  .spinner{text-align:center;color:var(--muted);font-size:13px;padding:40px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,25,20,.5);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;
    max-width:600px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
  .modal-head .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:4px;}
  .modal-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;}
  .x-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);font-size:18px;line-height:1;flex-shrink:0;}
  .x-close:hover{color:var(--text);border-color:var(--border-strong);}
  .modal-body{padding:22px 24px;}
  .modal-body p{font-size:14.5px;line-height:1.55;margin:0 0 12px;}
  .big-time{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:6px 0 4px;}
  .modal-foot{padding:0 24px 22px;}
  .modal-foot .btn{width:auto;float:right;}

  .score-block{text-align:center;padding:6px 0 18px;}
  .score-num{font-size:40px;font-weight:700;letter-spacing:-.02em;}
  .score-label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-top:4px;}
  .review-item{padding:15px 0;border-bottom:1px solid var(--border);}
  .review-item:last-child{border-bottom:none;}
  .review-item .tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:2px 8px;border-radius:5px;display:inline-block;margin-bottom:8px;}
  .tag.correct{background:var(--accent-soft);color:var(--accent);}
  .tag.incorrect{background:var(--rose-bg);color:var(--rose-tx);}
  .tag.ungraded{background:var(--slate-bg);color:var(--slate-tx);}
  .r-prompt{font-size:15.5px;font-weight:600;line-height:1.35;margin:2px 0 8px;}
  .r-line{font-size:13.5px;color:var(--muted);line-height:1.5;}
  .r-line .good{color:var(--accent);font-weight:600;}

  @media (max-width:560px){ .main{padding:22px 16px 60px;} .who .nm,.who .sub{display:none;} }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="screenLogin" class="login-wrap">
  <div class="login-card">
    <div class="login-brand"><span class="logo">T</span><span class="nm">TestPortal</span></div>
    <h1>Sign in</h1>
    <p class="lede">Enter your test-taker ID and password to see the tests assigned to you.</p>
    <div class="err" id="loginError" hidden></div>
    <form id="loginForm">
      <div class="field">
        <label for="loginId">Test-taker ID</label>
        <input type="text" id="loginId" autocomplete="username" placeholder="e.g. T-4821" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn primary" id="loginBtn">Sign in</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="screenApp" hidden>
  <div class="topbar">
    <div class="brand"><span class="logo">T</span>TestPortal</div>
    <div class="spacer"></div>
    <div class="who">
      <div class="avatar" id="avatar">–</div>
      <div><div class="nm" id="whoName">—</div><div class="sub" id="whoId"></div></div>
    </div>
    <button class="link-btn" id="logoutBtn">Sign out</button>
  </div>

  <main class="main">
    <div class="hello">
      <h1 id="helloTitle">Your tests</h1>
      <p id="helloSub">Loading…</p>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="grid" class="grid"></div>
    <div id="emptyState" class="empty" hidden>No tests have been assigned to you yet. Check back later.</div>
  </main>
</div>

<!-- ============ MODAL ============ -->
<div id="modal" class="overlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <div><div class="eyebrow" id="modalEyebrow"></div><h2 id="modalTitle"></h2></div>
      <button class="x-close" id="modalClose" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — paste the SAME Apps Script /exec URL used in
   quiz-engine.html and admin.html.
   ============================================================ */
const CONFIG = {
  appsScriptUrl: "https://script.google.com/macros/s/AKfycbx8_AAZkrvQGIvmORUN1wya8kcyzeOL-GTb3lzaFHnladKfpg4iaZ-ttpo9YfBJ8Z0x/exec"
};
const TOKEN_KEY = 'takerToken';

const $ = id => document.getElementById(id);
const els = {
  screenLogin:$('screenLogin'), screenApp:$('screenApp'),
  loginForm:$('loginForm'), loginId:$('loginId'), loginPassword:$('loginPassword'),
  loginBtn:$('loginBtn'), loginError:$('loginError'),
  avatar:$('avatar'), whoName:$('whoName'), whoId:$('whoId'), logoutBtn:$('logoutBtn'),
  helloTitle:$('helloTitle'), helloSub:$('helloSub'), tabs:$('tabs'), grid:$('grid'), emptyState:$('emptyState'),
  modal:$('modal'), modalEyebrow:$('modalEyebrow'), modalTitle:$('modalTitle'),
  modalBody:$('modalBody'), modalFoot:$('modalFoot'), modalClose:$('modalClose')
};

let ALL_TESTS = [];
let ACTIVE_FILTER = 'all';

function getToken(){ try{ return sessionStorage.getItem(TOKEN_KEY); }catch(e){ return null; } }
function setToken(t){ try{ sessionStorage.setItem(TOKEN_KEY,t); }catch(e){} }
function clearToken(){ try{ sessionStorage.removeItem(TOKEN_KEY); }catch(e){} }

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n){ return String(n).padStart(2,'0'); }
function fmt(input){
  if(!input) return '';
  const d=(input instanceof Date)?input:new Date(input);
  if(isNaN(d.getTime())) return String(input);
  let h=d.getHours(); const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12;
  return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()+', '+h+':'+pad(d.getMinutes())+' '+ap;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ const p=String(name||'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||'')||'?'; }

async function apiPost(payload){
  const res=await fetch(CONFIG.appsScriptUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  return res.json();
}
async function apiGet(params){
  const url=new URL(CONFIG.appsScriptUrl);
  Object.keys(params).forEach(k=>url.searchParams.set(k,params[k]));
  const res=await fetch(url); return res.json();
}

/* ---------- Login ---------- */
els.loginForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  els.loginError.hidden=true; els.loginBtn.disabled=true; els.loginBtn.textContent='Signing in…';
  try{
    const data=await apiPost({action:'takerLogin',id:els.loginId.value.trim(),password:els.loginPassword.value});
    if(!data.ok){ els.loginError.textContent=data.error||'Sign-in failed. Please try again.'; els.loginError.hidden=false; }
    else{ setToken(data.token); els.loginPassword.value=''; await showApp(); }
  }catch(err){
    els.loginError.textContent='Could not reach the server. Check your connection and try again.'; els.loginError.hidden=false;
  }finally{ els.loginBtn.disabled=false; els.loginBtn.textContent='Sign in'; }
});
els.logoutBtn.addEventListener('click', ()=>{ clearToken(); els.screenApp.hidden=true; els.screenLogin.hidden=false; });

/* ---------- Dashboard ---------- */
async function showApp(){
  els.screenLogin.hidden=true; els.screenApp.hidden=false;
  els.grid.innerHTML='<div class="spinner">Loading your tests…</div>';
  els.tabs.innerHTML=''; els.emptyState.hidden=true;

  let data;
  try{ data=await apiGet({action:'listTestsForMe',token:getToken()}); }
  catch(err){ els.grid.innerHTML='<div class="empty">Could not load your tests. Please try again.</div>'; return; }
  if(!data.ok){
    if(data.error==='unauthorized'){ clearToken(); els.screenApp.hidden=true; els.screenLogin.hidden=false; return; }
    els.grid.innerHTML='<div class="empty">Could not load your tests: '+esc(data.error||'unknown error')+'</div>'; return;
  }
  els.whoName.textContent=data.name||'(unnamed)';
  els.whoId.textContent=data.takerId||'';
  els.avatar.textContent=initials(data.name).toUpperCase();
  ALL_TESTS=data.tests||[];
  render();
}

const STATUS_ORDER={available:0,scheduled:1,completed:2,closed:3};
const STATUS_LABEL={available:'Available',scheduled:'Scheduled',completed:'Completed',closed:'Closed'};

function render(){
  if(!ALL_TESTS.length){ els.tabs.innerHTML=''; els.grid.innerHTML=''; els.emptyState.hidden=false; return; }
  els.emptyState.hidden=true;

  // counts + hello line
  const counts={}; ALL_TESTS.forEach(t=>counts[t.status]=(counts[t.status]||0)+1);
  const parts=[];
  if(counts.available) parts.push(counts.available+' available');
  if(counts.scheduled) parts.push(counts.scheduled+' scheduled');
  if(counts.completed) parts.push(counts.completed+' completed');
  if(counts.closed) parts.push(counts.closed+' closed');
  els.helloSub.textContent=parts.join(' · ')||(ALL_TESTS.length+' tests');

  // tabs: All + each present status
  const statuses=Object.keys(counts).sort((a,b)=>STATUS_ORDER[a]-STATUS_ORDER[b]);
  let tabsHtml='<button class="tab'+(ACTIVE_FILTER==='all'?' active':'')+'" data-f="all">All<span class="n">'+ALL_TESTS.length+'</span></button>';
  statuses.forEach(s=>{ tabsHtml+='<button class="tab'+(ACTIVE_FILTER===s?' active':'')+'" data-f="'+s+'">'+STATUS_LABEL[s]+'<span class="n">'+counts[s]+'</span></button>'; });
  els.tabs.innerHTML=tabsHtml;
  els.tabs.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{ ACTIVE_FILTER=b.dataset.f; render(); }));

  // cards
  const shown=ALL_TESTS.filter(t=>ACTIVE_FILTER==='all'||t.status===ACTIVE_FILTER)
    .sort((a,b)=>STATUS_ORDER[a.status]-STATUS_ORDER[b.status]);
  els.grid.innerHTML='';
  shown.forEach(t=>els.grid.appendChild(cardFor(t)));
}

function cardFor(t){
  const card=document.createElement('div');
  const meta=[];
  if(t.timeLimitMinutes) meta.push('<span>'+clockIcon()+t.timeLimitMinutes+' min</span>');
  let right='', foot='', handler=null, locked=false;

  if(t.status==='available'){
    if(t.deadline) meta.push('<span>'+calIcon()+'Closes '+esc(fmt(t.deadline))+'</span>');
    foot='<span class="cta">Open test</span><button class="go">Start →</button>';
    handler=()=>startTest(t.testCode);
  }else if(t.status==='scheduled'){
    meta.push('<span>'+calIcon()+'Opens '+esc(fmt(t.startDate))+'</span>');
    foot='<span class="cta muted">🔒 Not open yet</span><span class="cta muted">Details →</span>';
    handler=()=>scheduledPopup(t); locked=true;
  }else if(t.status==='completed'){
    if(t.submittedAt) meta.push('<span>'+checkIcon()+'Submitted '+esc(fmt(t.submittedAt))+'</span>');
    const sc=(t.score&&t.score.possible!==''&&t.score.possible!=null)?(esc(t.score.earned)+'<small> / '+esc(t.score.possible)+'</small>'):'';
    foot=(sc?'<span class="score tnum">'+sc+'</span>':'<span></span>')+'<span class="cta">View result →</span>';
    handler=()=>viewResult(t);
  }else{ // closed
    if(t.deadline) meta.push('<span>'+calIcon()+'Closed '+esc(fmt(t.deadline))+'</span>');
    foot='<span class="cta muted">Missed</span><span class="cta muted">Details →</span>';
    handler=()=>closedPopup(t); locked=true;
  }

  card.className='tcard live'+(locked?' locked':'');
  card.innerHTML=
    '<div class="top"><h3>'+esc(t.title||t.testCode)+'</h3><span class="badge '+t.status+'">'+STATUS_LABEL[t.status]+'</span></div>'+
    '<div class="meta">'+meta.join('')+'</div>'+
    '<div class="foot">'+foot+'</div>';
  if(handler) card.addEventListener('click',handler);
  return card;
}
function clockIcon(){ return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'; }
function calIcon(){ return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>'; }
function checkIcon(){ return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20 6 9 17l-5-5"/></svg>'; }

/* ---------- Actions ---------- */
function startTest(testCode){
  window.location.href='quiz-engine.html?test='+encodeURIComponent(testCode)+'&token='+encodeURIComponent(getToken());
}
function scheduledPopup(t){
  openModal({eyebrow:'Not open yet',title:t.title||t.testCode,
    bodyHtml:'<p>This test hasn\'t opened yet. It becomes available at:</p><div class="big-time">'+esc(fmt(t.startDate))+'</div>'+
      (t.deadline?'<p style="color:var(--faint);font-size:13px;">Closes '+esc(fmt(t.deadline))+'</p>':''),
    footHtml:'<button class="btn primary" onclick="closeModal()">Got it</button>'});
}
function closedPopup(t){
  openModal({eyebrow:'Closed',title:t.title||t.testCode,
    bodyHtml:'<p>This test has closed'+(t.deadline?' (deadline was <b>'+esc(fmt(t.deadline))+'</b>)':'')+' and can no longer be taken. If you think this is a mistake, contact your administrator.</p>',
    footHtml:'<button class="btn primary" onclick="closeModal()">Close</button>'});
}
async function viewResult(t){
  openModal({eyebrow:'Result',title:t.title||t.testCode,bodyHtml:'<div class="spinner">Loading your result…</div>',footHtml:''});
  let data;
  try{ data=await apiGet({action:'getMyResult',token:getToken(),testCode:t.testCode}); }
  catch(err){ els.modalBody.innerHTML='<p>Could not load this result. Please try again.</p>'; return; }
  if(!data.ok||!data.result){
    els.modalBody.innerHTML='<p>'+(data.error==='not_found'?'No stored result was found for this test.':'Could not load this result: '+esc(data.error||'unknown error'))+'</p>'; return;
  }
  els.modalBody.innerHTML=renderResultHtml(data.result);
  els.modalFoot.innerHTML='<button class="btn primary" onclick="closeModal()">Close</button>';
}
function renderResultHtml(p){
  const s=p.score||{}; const hasGraded=s.gradableQuestionCount>0;
  let html='<div class="score-block">';
  html+=hasGraded
    ? '<div class="score-num tnum">'+esc(s.earned)+' / '+esc(s.possible)+'</div><div class="score-label">Auto-graded score'+(p.autoSubmittedOnTimeout?' · time expired':'')+'</div>'
    : '<div class="score-num">Submitted</div><div class="score-label">Free-text answers reviewed manually</div>';
  html+='</div>';
  (p.answers||[]).forEach(a=>{
    if(a.type==='passage') return;
    let tag,cls;
    if(a.type==='mc'){ cls=a.correct?'correct':'incorrect'; tag='Q'+pad(a.number)+' · '+(a.correct?'correct':'incorrect'); }
    else{ cls='ungraded'; tag='Q'+pad(a.number)+' · manually graded'; }
    html+='<div class="review-item"><span class="tag '+cls+'">'+tag+'</span>'+
      '<div class="r-prompt">'+esc(a.prompt)+'</div>'+
      '<div class="r-line">Your answer: '+(a.answerGiven?(a.correct?'<span class="good">'+esc(a.answerGiven)+'</span>':esc(a.answerGiven)):'<em>no answer</em>')+'</div>'+
      (a.type==='mc'&&!a.correct&&a.correctAnswer?'<div class="r-line">Correct answer: <span class="good">'+esc(a.correctAnswer)+'</span></div>':'')+
      (a.referenceAnswer?'<div class="r-line">Reference answer: '+esc(a.referenceAnswer)+'</div>':'')+
      (a.explanation?'<div class="r-line" style="margin-top:6px;"><b>Explanation:</b> '+esc(a.explanation)+'</div>':'')+
      '</div>';
  });
  return html;
}

/* ---------- Modal plumbing ---------- */
function openModal(o){
  els.modalEyebrow.textContent=o.eyebrow||''; els.modalTitle.textContent=o.title||'';
  els.modalBody.innerHTML=o.bodyHtml||''; els.modalFoot.innerHTML=o.footHtml||''; els.modal.hidden=false;
}
function closeModal(){ els.modal.hidden=true; }
els.modalClose.addEventListener('click',closeModal);
els.modal.addEventListener('click',e=>{ if(e.target===els.modal) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- Boot ---------- */
(async function init(){
  const preId=new URLSearchParams(window.location.search).get('id');
  if(preId) els.loginId.value=preId;
  if(getToken()) await showApp(); else els.screenLogin.hidden=false;
})();
</script>
</body>
